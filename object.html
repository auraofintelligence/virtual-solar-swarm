<meta name="description" content="Full mission dossier for one Virtual Solar Swarm target: orbit, stable orbits, launch windows, sensor fit-out and replacement cadence.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">

<footer id="site-footer"></footer>
<script src="assets/astro.js"></script>

<script src="data/objects-moons.js"></script>
<script src="data/objects-asteroids.js"></script>

<script>
VSS.mountChrome("targets.html");

/* The Sun is the one body on this site you can go and look at right now.
   Latest frames from NASA's Solar Dynamics Observatory, refreshed while the
   page is open. If the feed cannot be reached, the static map takes over. */
function mountSunLive() {
  var CHANNELS = [
    { id: "0193", name: "Corona", note: "hot coronal plasma around 1 million degrees, and flare plasma far hotter" },
    { id: "0171", name: "Coronal loops", note: "the quiet corona and its arching magnetic loops, around 600,000 degrees" },
    { id: "0304", name: "Chromosphere", note: "the layer where prominences arc off the edge, around 50,000 degrees" },
    { id: "0131", name: "Flares", note: "flaring regions at around 10 million degrees" },
    { id: "HMIIC", name: "Visible surface", note: "the Sun as the eye would see it, sunspots and all" },
    { id: "HMIB", name: "Magnetic field", note: "a magnetogram: white and black are opposite magnetic polarities" }
  ];
  var host = document.getElementById("sun-live");
  if (!host) return;
  var cur = 0, timer = null;

  function url(ch) {
    return "https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_" + ch + ".jpg?t=" + Date.now();
  }
  function draw() {
    var ch = CHANNELS[cur];
    host.className = "card sun-live";
    host.innerHTML =
      '<div class="sun-live-frame"><img id="sun-live-img" alt="Latest image of the Sun from NASA Solar Dynamics Observatory, ' + ch.name + ' channel" src="' + url(ch.id) + '">' +
      '<span class="sun-live-dot">live</span></div>' +
      '<div class="sun-live-words"><h3>The Sun, right now</h3>' +
      '<p class="dim small"><strong>' + ch.name + ".</strong> " + ch.note + "</p>" +
      '<div class="chip-row">' + CHANNELS.map(function (c, i) {
        return '<button class="chip" data-ch="' + i + '" aria-pressed="' + (i === cur) + '">' + c.name + "</button>";
      }).join("") + "</div>" +
      '<p class="faint" id="sun-live-stamp">Fetched ' + new Date().toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" }) +
      '. The observatory posts fresh frames every few minutes; this panel refreshes itself while the page is open.</p>' +
      '<p class="faint">Imagery: <a href="https://sdo.gsfc.nasa.gov/">NASA Solar Dynamics Observatory</a>, public domain. Everything else on this page is a model; this is the real thing.</p></div>';
    host.querySelectorAll("[data-ch]").forEach(function (b) {
      b.addEventListener("click", function () { cur = +b.dataset.ch; draw(); });
    });
    var img = document.getElementById("sun-live-img");
    img.addEventListener("error", function () {
      host.className = "card";
      host.innerHTML = '<h3>The Sun, right now</h3><p class="dim small">The live feed from the NASA Solar Dynamics Observatory could not be reached from here. ' +
        'It lives at <a href="https://sdo.gsfc.nasa.gov/">sdo.gsfc.nasa.gov</a>.</p>' +
        '<div class="portrait-hero" style="float:none;margin:0"><canvas id="portrait" width="300" height="300"></canvas>' +
        '<div class="faint">the stored map instead</div></div>';
      var c = document.getElementById("portrait");
      if (c && window.VSS_BY_ID.sun) window.VSS_ART.paint(c, window.VSS_BY_ID.sun);
      if (timer) clearInterval(timer);
    });
  }
  draw();
  timer = setInterval(function () {
    var img = document.getElementById("sun-live-img");
    if (img) {
      img.src = url(CHANNELS[cur].id);
      var st = document.getElementById("sun-live-stamp");
      if (st) st.textContent = "Refreshed " + new Date().toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" }) +
        ". The observatory posts fresh frames every few minutes; this panel refreshes itself while the page is open.";
    }
  }, 240000);
}

(function () {
  var id = VSS.qs("id") || "enceladus";
  var o = window.VSS_BY_ID[id];
  var page = document.getElementById("page");
  if (!o) {
    page.innerHTML = "<h1>No such target</h1><p>That id is not in the catalogue. Back to <a href='targets.html'>the 200</a>.</p>";
    return;
  }
  document.title = o.name + " : Virtual Solar Swarm";

  var A = window.ASTRO;
  var parent = o.parent ? window.VSS_BY_ID[o.parent] : null;
  var ho = VSS.helioOrbitOf(o);
  var isSun = o.cls === "star";
  var isEarth = o.id === "earth";
  var isInterstellar = o.cls === "interstellar";
  var sats = VSS.tierCount(o);
  var life = VSS.DESIGN_LIFE[o.env];

  var gm = A.gmOf(o);
  var massNote = o.massKg ? "" : " (estimated from size)";

  // ----- fast facts -----
  var distLine;
  if (isSun) distLine = "0 AU, the centre of it all";
  else if (isInterstellar) distLine = "passing through; closest approach " + VSS.fmt(o.orbit.qAU, 2) + " AU from the Sun";
  else if (parent) distLine = VSS.fmt(o.orbit.aKm >= 1e6 ? o.orbit.aKm / 1e6 : o.orbit.aKm, o.orbit.aKm >= 1e6 ? 2 : 0) + (o.orbit.aKm >= 1e6 ? " million km" : " km") + " from " + parent.name + ", which rides at " + VSS.fmt(ho.aAU, 2) + " AU";
  else distLine = VSS.fmt(ho.aAU, ho.aAU < 10 ? 2 : 1) + " AU from the Sun";

  var periodLine;
  if (isSun) periodLine = "spins in about 25 days at its equator";
  else if (isInterstellar) periodLine = "never coming back; its path is a one-way curve";
  else if (parent) periodLine = "laps " + parent.name + " every " + VSS.fmt(o.orbit.periodDays, o.orbit.periodDays < 10 ? 2 : 1) + " days";
  else periodLine = "laps the Sun every " + VSS.fmtDur(A.periodYearsOf(ho));

  var html = "";
  html += '<p class="faint"><a href="targets.html">← the catalogue</a></p>';
  var mapped = window.VSS_MAPS && window.VSS_MAPS[o.id];
  if (!isSun)
  html += '<div class="portrait-hero"><canvas id="portrait" width="300" height="300"></canvas>' +
    '<div class="faint">' + (mapped
      ? "wearing its real map · " + mapped.credit
      : "no map of it aboard this site; drawn as a lit sphere under a latitude and longitude grid rather than an invented surface") +
    "</div></div>";
  html += "<h1>" + o.name + "</h1>";
  html += '<p><span class="badge t-' + o.tier + '">' + VSS.TIERS[o.tier].label +
    (o.tier === "survey" ? "" : " · " + sats + " satellites") + "</span> &nbsp; " +
    '<span class="dim">' + (VSS.CLS_LABEL[o.cls] || o.cls) + " · " + o.group + "</span></p>";
  if (o.tier === "survey") {
    html += '<p class="dim small">A census entry: no dedicated picket, but the host system\'s swarm and the survey sweeps keep it in view, and any of it is one decision away from a picket of its own.</p>';
  }
  html += '<p class="lede">' + (o.why || "") + "</p>";
  if (isSun) html += '<div id="sun-live"></div><div id="song-sun"></div>';

  html += '<div class="grid cols-2">';
  html += '<div class="card"><h3>Fast facts</h3><dl class="kv">' +
    "<dt>Distance</dt><dd>" + distLine + "</dd>" +
    "<dt>Mean radius</dt><dd>" + VSS.fmt(o.radiusKm, o.radiusKm < 10 ? 1 : 0) + " km</dd>" +
    "<dt>Mass</dt><dd>" + (o.massKg ? o.massKg.toExponential(2) + " kg" : (gm / A.G_KM).toExponential(1) + " kg" + massNote) + "</dd>" +
    "<dt>Orbit</dt><dd>" + periodLine + "</dd>" +
    "<dt>Environment</dt><dd>" + VSS.ENV_LABEL[o.env] + "</dd>" +
    "<dt>Design life there</dt><dd>" + (life ? life + " years per satellite" : "single flyby, no station-keeping") + "</dd>" +
    "</dl></div>";

  // ----- stable orbits -----
  html += '<div class="card"><h3>Stable orbits around it</h3>';
  if (isSun) {
    html += '<p class="dim small">Not a ring. Watching a star properly means several different regimes at once, each seeing something the others cannot, from divers inside the corona to listeners out past the edge of the heliosphere. Set out below, with the share of your solar observatory each would take.</p>';
    html += '<p class="small"><a href="#stations">The eleven station types &darr;</a></p>';
  } else if (isInterstellar) {
    html += '<p class="dim small">There is no stable orbit to be had: the visitor is moving too fast for anything to hold it. The plan here is an interceptor pair launched onto a crossing path, one good flyby each, instruments running the whole way past.</p>';
  } else {
    var parentGm = parent ? A.gmOf(parent) : A.GM_SUN;
    var distKm = parent ? o.orbit.aKm : ho.aAU * A.AU_KM;
    var bands = A.stableBands(o, parentGm, distKm);
    html += '<dl class="kv">' +
      "<dt>Gravitational reach</dt><dd>" + VSS.fmtKm(bands.hillKm) + " (its Hill sphere, the zone where its pull beats " + (parent ? parent.name + "'s" : "the Sun's") + ")</dd>" +
      "<dt>Lowest safe lap</dt><dd>" + VSS.fmtKm(bands.minKm) + " from centre</dd>" +
      "<dt>Highest steady lap</dt><dd>" + VSS.fmtKm(bands.progradeMaxKm) + " orbiting the usual way, " + VSS.fmtKm(bands.retrogradeMaxKm) + " orbiting backwards</dd>" +
      "</dl>";
    if (bands.usable) {
      var rPick = Math.max(bands.minKm * 1.5, Math.min(bands.minKm * 3, bands.progradeMaxKm / 2));
      var hPick = A.orbPeriodHours(gm, rPick);
      html += '<p class="small dim">A picket at ' + VSS.fmtKm(rPick) + " would lap every " + (hPick < 48 ? VSS.fmt(hPick, 1) + " hours" : VSS.fmt(hPick / 24, 1) + " days") + " at " + VSS.fmtSpeed(A.circVel(gm, rPick)) + ".</p>";
    } else {
      html += '<p class="small dim">The stable zone here is thin; watchers would fly slow station-keeping arcs rather than true orbits.</p>';
    }
    html += '<p class="small"><a href="orbit-lab.html?id=' + o.id + '">Open in the orbit lab →</a> · <a href="gravity.html?id=' + o.id + '">see the Lagrange landscape →</a></p>';
  }
  html += "</div></div>";

  // ----- getting there -----
  html += '<div class="grid cols-2">';
  html += '<div class="card"><h3>Getting there</h3>';
  if (isSun) {
    html += '<p class="dim small">Inward transfers leave whenever you like: the Sun is always where you left it. The hard part is shedding Earth\'s sideways speed; close solar orbits usually borrow gravity assists from Venus, the way Parker Solar Probe and Solar Orbiter did.</p>';
  } else if (isEarth) {
    html += '<p class="dim small">You are here. Earth\'s own swarm would ride familiar orbits from low Earth orbit out to the magnetotail, no interplanetary cruise required.</p>';
  } else if (isInterstellar) {
    html += '<p class="dim small">No schedule exists for these: each visitor is discovered on its way in, and the window is measured in months. This is why the fleet keeps fuelled interceptors parked and waiting rather than building to order.</p>';
  } else if (ho.e > 0.85) {
    var peris = A.nextPerihelia(ho, new Date(), 1);
    var py = peris.length ? peris[0].getFullYear() : null;
    html += '<p class="dim small">This orbit is too stretched for the ferry-route maths: the body spends almost all its time far out, then dives past the Sun. A mission launches to meet it inbound near perihelion' +
      (py && py < 12000 ? ", next due around " + (py > 3000 ? "the year " + VSS.fmt(py) : py) + "." : "; its next dive is beyond any human calendar.") + "</p>";
    html += '<p class="small"><a href="windows.html?id=' + o.id + '">Perihelion model →</a></p>';
  } else {
    var earth = window.VSS_BY_ID.earth.orbit;
    var h = A.hohmann(earth.aAU, ho.aAU);
    var syn = A.synodicYears(A.periodYearsOf(earth), A.periodYearsOf(ho));
    var wins = A.nextWindows(earth, ho, new Date(), 3);
    html += '<dl class="kv">' +
      "<dt>Cruise time</dt><dd>" + VSS.fmtDur(h.tofYears) + " on the fuel-cheapest path" + (h.tofYears > 40 ? "; in practice a mission this deep would fly a faster, meaner path and brake harder" : "") + "</dd>" +
      "<dt>Departure push</dt><dd>" + VSS.fmt(h.dvDep, 1) + " km/s beyond Earth's orbit speed</dd>" +
      "<dt>Window rhythm</dt><dd>" + (isFinite(syn) ? "a door opens every " + VSS.fmtDur(syn) : "no regular rhythm") + "</dd>" +
      (wins.length ? "<dt>Next doors</dt><dd>" + wins.map(VSS.fmtDate).join(" · ") + "</dd>" : "") +
      "</dl>";
    html += '<p class="small"><a href="windows.html?id=' + o.id + '">Full window model →</a></p>';
  }
  html += "</div>";

  // ----- watching it -----
  var kitKey = window.VSS_KIT_OF(o);
  var kitIds = window.VSS_KITS[kitKey] || [];
  var sensors = window.VSS_SENSORS.filter(function (s) { return kitIds.indexOf(s.id) >= 0; });
  var busId = window.VSS_BUS_OF(o);
  var bus = window.VSS_BUSES.filter(function (b) { return b.id === busId; })[0];
  var kitMass = sensors.reduce(function (a, s) { return a + s.massKg; }, 0);
  var kitCost = sensors.reduce(function (a, s) { return a + s.costUsdM; }, 0);
  html += '<div class="card"><h3>Watching it</h3>';
  html += '<p class="dim small">Recommended fit-out for a ' + (VSS.CLS_LABEL[o.cls] || o.cls).toLowerCase() + ":</p>";
  html += '<div class="chip-row">' + sensors.map(function (s) {
    return '<span class="chip" title="' + s.short + '">' + s.name + "</span>";
  }).join("") + "</div>";
  html += '<dl class="kv">' +
    "<dt>Bus</dt><dd>" + bus.name + ". " + bus.role + "</dd>" +
    "<dt>Payload</dt><dd>" + VSS.fmt(kitMass, 1) + " kg of " + VSS.fmt(bus.capacityKg) + " kg capacity</dd>" +
    "<dt>Cost each</dt><dd>" + VSS.fmtAudFull(kitCost + bus.costUsdM) + " at production scale</dd>" +
    (o.tier === "survey"
      ? "<dt>Station</dt><dd>none dedicated; the host swarm looks in on schedule</dd>"
      : "<dt>Whole picket</dt><dd>" + VSS.fmtAud((kitCost + bus.costUsdM) * sats) + " for all " + sats + "</dd>") +
    "</dl>";
  html += '<p class="small"><a href="builder.html?id=' + o.id + '">Open in the builder →</a></p></div></div>';

  // ----- keeping it alive -----
  html += '<div class="card"><h3>Keeping the picket whole</h3>';
  if (o.tier === "survey") {
    html += '<p class="dim small">No picket to keep whole. If this body were promoted, its watchers would ride the host system\'s <a href="convoys.html">renewal convoys</a> like everything else out this way.</p>';
  } else if (isInterstellar) {
    html += '<p class="dim small">Interceptors are not replaced; they are spent. The cadence model instead keeps two fuelled and waiting at all times.</p>';
  } else if (ho && ho.e > 0.85) {
    html += '<p class="dim small">A body on a dive-and-vanish orbit cannot be resupplied on a schedule; its picket of ' + sats + " would launch with the perihelion intercept and carry its own spares, riding along for the whole pass.</p>";
  } else {
    var perYear = sats / life;
    var earthO = window.VSS_BY_ID.earth.orbit;
    var lead = (isSun || isEarth) ? 0.3 : Math.min(A.hohmann(earthO.aAU, ho.aAU).tofYears, 25);
    html += '<p class="dim small">With a design life of ' + life + " years out here, this station of " + sats + " would lose on average " +
      (perYear >= 1 ? VSS.fmt(perYear, 1) + " satellites a year" : "one satellite every " + VSS.fmtDur(1 / perYear)) +
      ". Because the cruise out takes " + VSS.fmtDur(lead) + ", each replacement would need to launch that far ahead of the predicted failure: the factory is always building for the fleet as it will be, not as it is.</p>";
    html += '<p class="small"><a href="cadence.html">Whole-fleet cadence model →</a></p>';
  }
  html += "</div>";

  // ----- watching the real thing: open data, for the Sun -----
  if (isSun) {
    html += '<h2 style="clear:both">Watching the real Sun</h2>';
    html += '<p class="dim small">Everything else on this site is a model. These are the real feeds, most of them open data you can pull yourself.</p>';
    html += '<div class="grid cols-3">';
    html += '<div class="card"><h3>Live right now</h3><ul class="dim small" style="display:grid; gap:.35rem; padding-left:1.1rem">' +
      '<li><a href="https://www.swpc.noaa.gov/">NOAA Space Weather Prediction Center</a>: the official forecasts, alerts and real-time solar wind from L1</li>' +
      '<li><a href="https://sdo.gsfc.nasa.gov/">NASA Solar Dynamics Observatory</a>: the Sun photographed in a dozen wavelengths, updated continuously</li>' +
      '<li><a href="https://science.nasa.gov/mission/solar-orbiter/">ESA and NASA Solar Orbiter</a>: the mission flying over the solar poles this site keeps citing</li>' +
      '<li><a href="https://helioviewer.org/">Helioviewer</a>: browse and stack decades of solar imagery in one viewer</li>' +
      "</ul></div>";
    html += '<div class="card"><h3>Daily watch</h3><ul class="dim small" style="display:grid; gap:.35rem; padding-left:1.1rem">' +
      '<li><a href="https://spaceweathernews.com/">Space Weather News</a>: daily independent briefings on the Sun, the field and the forecast</li>' +
      '<li><a href="https://spaceweather.com/">SpaceWeather.com</a>: long-running daily log of flares, spots and aurora</li>' +
      '<li><a href="https://www.spaceweatherlive.com/">SpaceWeatherLive</a>: live dials, archives and aurora alerts</li>' +
      '<li><a href="https://auraofintelligence.github.io/space-weather-news/">Space Weather News, civic newsroom</a>: our own build, plain-language and local</li>' +
      "</ul></div>";
    html += '<div class="card"><h3>Data you can query</h3><ul class="dim small" style="display:grid; gap:.35rem; padding-left:1.1rem">' +
      '<li><a href="https://api.nasa.gov/">NASA Open APIs</a>: a free key, then imagery and space weather endpoints</li>' +
      '<li><a href="https://ccmc.gsfc.nasa.gov/tools/DONKI/">DONKI</a>: NASA catalogue of flares, coronal mass ejections and storms, with an API</li>' +
      '<li><a href="https://cdaweb.gsfc.nasa.gov/">CDAWeb</a>: the raw heliophysics archive, decades of field and particle data</li>' +
      '<li><a href="https://ssd.jpl.nasa.gov/horizons/">JPL Horizons</a>: the ephemeris this site orbits should be checked against</li>' +
      "</ul></div></div>";
    html += '<p class="small"><a href="sun-watchers.html">Everything that has ever watched the Sun, and what is being built next &rarr;</a></p>';

    // ----- the station architecture -----
    var stations = window.VSS_SOLAR_STATIONS || [];
    var obsN = VSS.tierCount(o);
    html += '<h2 id="stations" style="clear:both">Where the watchers would actually sit</h2>';
    html += '<p class="dim small">A star is not watched from one place. These are the regimes a solar observatory would spread across, each with what it alone can see, what makes it hard, and something real that has flown there. Counts follow the ' +
      VSS.fmt(obsN) + ' watchers you have the observatory set to; change that on <a href="index.html">the home page</a>.</p>';
    html += '<div class="grid cols-2">' + stations.map(function (st) {
      var n = Math.max(1, Math.round(obsN * st.share));
      return '<div class="card"><div class="mission-head"><h3>' + st.name + '</h3>' +
        '<span class="st st-operating">' + VSS.fmt(n) + ' of ' + VSS.fmt(obsN) + "</span></div>" +
        '<p class="mission-years">' + st.where + "</p>" +
        '<p class="dim small">' + st.sees + "</p>" +
        '<p class="dim small mission-finding"><strong>The hard part.</strong> ' + st.hard + "</p>" +
        '<p class="small"><a href="' + st.link + '">' + st.precedent + " &rarr;</a></p></div>";
    }).join("") + "</div>";
    html += '<p class="faint">Shares are a studio assumption, not a derived optimum: they are one opinion about how to split attention, and they are in the data file for anyone who wants to argue with them. What is not an assumption is the list itself. Every regime here has been flown, is being built, or has a published mission study behind it.</p>';
    html += '<p class="faint">The wilder end of the solar-cycle question, micro-novas and galactic current sheets included, is gathered separately in <a href="https://auraofintelligence.github.io/micronova-and-excursions/">Micronova and Excursions</a>: an evidence ledger rather than a verdict.</p>';
  }

  // ----- the system around it -----
  var kids = window.VSS_OBJECTS.filter(function (k) { return k.parent === o.id; });
  if (kids.length) {
    kids.sort(function (a, b) { return (a.orbit.aKm || 0) - (b.orbit.aKm || 0); });
    var funded = kids.filter(function (k) { return k.tier !== "survey"; }).length;
    html += '<h2 style="clear:both">In this system</h2>' +
      '<p class="dim small">' + kids.length + " catalogued companions, " + funded + " with dedicated watchers; the rest are census entries covered by the system swarm.</p>" +
      '<div class="table-wrap"><table><thead><tr><th></th><th>Name</th><th class="num">Distance</th><th class="num">Radius (km)</th><th>Tier</th><th>Note</th></tr></thead><tbody>' +
      kids.map(function (k) {
        return "<tr><td class='thumb-cell'><canvas class='thumb' width='42' height='42' data-obj='" + k.id + "'></canvas></td>" +
          "<td><a href='object.html?id=" + k.id + "'>" + k.name + "</a></td>" +
          "<td class='num'>" + VSS.fmtKm(k.orbit.aKm) + "</td>" +
          "<td class='num'>" + VSS.fmt(k.radiusKm, k.radiusKm < 10 ? 1 : 0) + "</td>" +
          "<td><span class='badge t-" + k.tier + "'>" + VSS.TIERS[k.tier].label + "</span></td>" +
          "<td class='wrap dim small'>" + (k.why || "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  if (parent) {
    html += '<p class="small">Part of the <a href="object.html?id=' + parent.id + '">' + parent.name + " system →</a></p>";
  }

  page.innerHTML = html;
  if (isSun) {
    VSS.mountSong("song-sun", {
      title: "Heliospheric Lantern",
      file: "assets/music/heliospheric-lantern.mp4",
      poster: "assets/music/heliospheric-lantern.jpg",
      blurb: "The Sun, singing for itself: a G-type flame drifting the Orion Arm, keeping the time we live by."
    });
  }
  if (isSun) mountSunLive();
  var portraitEl = document.getElementById("portrait");
  if (portraitEl) window.VSS_ART.paint(portraitEl, o);
  window.VSS_ART.autoPaint(page);
})();
</script>
</body>
</html>
